[project]
name = "medical-report"
version = "0.1.0"
description = "An OCR based medical report application"
authors = [
    {name = "Adarsh"}
]
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi (>=0.117.1,<0.118.0)",
    "uvicorn (>=0.37.0,<0.38.0)",
    "pytesseract (>=0.3.13,<0.4.0)",
    "pillow (>=11.3.0,<12.0.0)",
    "spacy (>=3.8.7,<4.0.0)",
    "pydantic (>=2.11.9,<3.0.0)",
    "numpy (>=2.3.3,<3.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "google-generativeai (>=0.8.3,<1.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
